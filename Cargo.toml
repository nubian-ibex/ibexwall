[workspace]
resolver = "3"
members = ["crates/*", "xtask", "plugins/*/src", "ui/src-tauri"]
# Only builds for the eBPF target via `cargo xtask ebpf` (bpf-linker).
exclude = ["crates/ibexwall-ebpf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
repository = "https://github.com/nubian-ibex/ibexwall"
homepage = "https://ibexwall.com"

[workspace.dependencies]
ibexwall-proto = { path = "crates/ibexwall-proto", version = "0.1.0" }
ibexwall-sdk = { path = "crates/ibexwall-sdk", version = "0.1.0" }
ibexwall-varlink = { path = "crates/ibexwall-varlink", version = "0.1.0" }
ibexwall-token = { path = "crates/ibexwall-token", version = "0.1.0" }
ibexwall-tui = { path = "crates/ibexwall-tui", version = "0.1.0" }
ibexwall-sys = { path = "crates/ibexwall-sys", version = "0.1.0" }
ibexwall-dns = { path = "crates/ibexwall-dns", version = "0.1.0" }
ibexwall-apps = { path = "crates/ibexwall-apps", version = "0.1.0" }
ibexwall-firewall = { path = "crates/ibexwall-firewall", version = "0.1.0" }
ibexwall-identity = { path = "crates/ibexwall-identity", version = "0.1.0" }
ibexwall-nfq = { path = "crates/ibexwall-nfq", version = "0.1.0" }
ibexwall-net-common = { path = "crates/ibexwall-net-common", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "process",
  "fs",
  "signal",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
hickory-server = { version = "0.26", default-features = false, features = ["resolver"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "tls-ring", "https-ring", "quic-ring", "h3-ring", "webpki-roots"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustix = { version = "1", features = ["event", "fs", "net", "process", "system"] }
sha2 = "0.11"
serde_jcs = "0.2"
hex = "0.4"
minisign-verify = "0.3"
ed25519-dalek = "3"
base64 = "0.22"
blake2 = "0.10"
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
proptest = "1"
ratatui = "0.30"
crossterm = "0.29"

# SEC-07: no unsafe anywhere; designated modules will be carved out via
# dedicated crates with SAFETY comments when eBPF/FFI lands.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A panic on a None or an Err is a decision; say it with expect(), which names
# the invariant. Tests are exempt (clippy.toml).
unwrap_used = "warn"
# Packages ship stripped, LTO-linked binaries (F10 M2). panic=abort is left
# off on purpose: with unwinding, a panic in one tokio task ends that task,
# not the whole daemon; it would save little size for that risk.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

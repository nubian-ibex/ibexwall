[package]
name = "ibexwall-mcp"
description = "IbexWall MCP server: read-only assistant access and change proposals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "ibexwall_mcp"
path = "src/lib.rs"

[[bin]]
name = "ibexwall-mcp"
path = "src/main.rs"

[dependencies]
ibexwall-proto.workspace = true
ibexwall-varlink.workspace = true
ibexwall-sys.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
tokio.workspace = true
ibexwall-token = { path = "../ibexwall-token", version = "0.2.0" }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = "0.14"

[package]
name = "ibexwall-plugins"
description = "The official IbexWall plugins in one multicall binary (ADR-0041)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "ibexwall-plugins"
path = "src/main.rs"

[dependencies]
ibexwall-plugin-flatpak-network = { path = "../../plugins/apps.flatpak-network/src", version = "0.1.0" }

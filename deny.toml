# cargo-deny configuration.
# License policy from the engineering spec §9: permissive licenses for
# dependencies; GPL is additionally allowed for workspace crates themselves
# (ibexwall-proto and ibexwall-sdk must stay permissive-only: they never
# link GPL code, reviewed per PR).
[graph]
all-features = true

[advisories]
version = 2
ignore = [
  # Unmaintained-only (no known exploit), inherited from the GTK stack
  # that Tauri uses on Linux (glib-macros -> gtk -> tauri). The whole
  # ecosystem carries it; remove when glib-macros drops it.
  "RUSTSEC-2024-0370",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  # workspace crates (self-licenses)
  "GPL-3.0-or-later",
  "GPL-2.0-only",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

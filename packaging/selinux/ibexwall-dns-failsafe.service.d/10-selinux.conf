# This drop-in ships with the SELinux policy package (ibexwall-selinux): the
# failsafe runs in its own permissive domain, so restoring the person's DNS
# is never blocked by policy, and every use is logged. The resolver's own
# domain must not do this: it faces the network and would need broad rights.
[Service]
SELinuxContext=system_u:system_r:ibexwall_failsafe_t:s0

# Users who run an AI assistant (MCP client) are added to this group; see
# the polkit rule 49-ibexwall-assistants.rules for what it allows.
g ibexwall-assistants -

# People who may change IbexWall without a password; empty until an
# administrator adds someone. See the polkit rule 49-ibexwall-admins.rules.
g ibexwall-admins -

# The HTTPS MCP server runs as its own unprivileged user, in the assistants
# group, so it can do no more than any other assistant.
u ibexwall-mcp - "IbexWall MCP server" /var/lib/ibexwall-mcp /usr/sbin/nologin
m ibexwall-mcp ibexwall-assistants

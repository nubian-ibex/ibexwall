# Type Path Mode User Group Age Argument
# The socket directory for the daemon and the resolver's status directory.
d /run/ibexwall 0755 root root -
d /run/ibexwall/dns 0750 ibexwall-dns ibexwall-dns -
d /run/ibexwall/plugins 0755 root root -
# Persistent state.
d /var/lib/ibexwall 0750 root root -

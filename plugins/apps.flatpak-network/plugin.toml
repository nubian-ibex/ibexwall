id = "apps.flatpak-network"
version = "0.1.0"
api = 1
category = "apps"
kinds = ["check", "control"]
origin = "official"
license = "GPL-3.0-or-later"
binary = "ibexwall-plugin-flatpak-network"
default_enabled = false
distros = ["fedora", "ubuntu", "debian", "arch"]

[name]
en = "Flatpak network access"
pt-BR = "Acesso à rede dos apps Flatpak"
es = "Acceso a la red de Flatpak"
fr = "Accès réseau Flatpak"
de = "Flatpak-Netzwerkzugriff"

[description]
en = "Cuts the network access of a Flatpak app with a reversible override."
pt-BR = "Corta o acesso à rede de um app Flatpak com uma sobreposição reversível."
es = "Corta el acceso a la red de una aplicación Flatpak con una anulación reversible."
fr = "Coupe l'accès réseau d'une application Flatpak avec un remplacement réversible."
de = "Sperrt den Netzwerkzugriff einer Flatpak-App mit einer umkehrbaren Überschreibung."

[privileges]
write_paths = ["/var/lib/flatpak/overrides"]

[sandbox]
user = "dynamic"
capabilities = []
read_paths = ["/var/lib/flatpak/app", "/var/lib/flatpak/overrides"]
network = false

[risk]
affects = ["network"]
reversible = "immediate"
confirm_timeout = false
may_affect = ["flatpak-network-may-affect-needs-network", "flatpak-network-may-affect-updates"]

[ui]
icon = "box"
order = 40

id = "apps.flatpak-perms"
version = "0.1.0"
api = 1
category = "apps"
kinds = ["check"]
origin = "official"
license = "GPL-3.0-or-later"
binary = "ibexwall-plugin-flatpak-perms"
default_enabled = true
distros = ["fedora", "ubuntu", "debian", "arch"]

[name]
en = "Flatpak permissions"
pt-BR = "Permissões dos Flatpak"
es = "Permisos de Flatpak"
fr = "Permissions Flatpak"
de = "Flatpak-Berechtigungen"

[description]
en = "Lists Flatpak apps that can reach your files, devices or the sandbox's own controls."
pt-BR = "Lista os apps Flatpak que alcançam seus arquivos, dispositivos ou os controles do próprio sandbox."
es = "Enumera las aplicaciones Flatpak que pueden acceder a tus archivos, dispositivos o a los controles del propio sandbox."
fr = "Liste les applications Flatpak qui peuvent atteindre vos fichiers, vos appareils ou les contrôles propres au bac à sable."
de = "Listet Flatpak-Apps auf, die Ihre Dateien, Geräte oder die eigenen Steuerungen der Sandbox erreichen können."

[privileges]
# Read-only check: the core executes nothing on its behalf.

[sandbox]
user = "dynamic"
capabilities = ["CAP_DAC_READ_SEARCH"]
read_paths = ["/var/lib/flatpak", "/home"]
network = false

[risk]
affects = []
reversible = "immediate"
confirm_timeout = false
may_affect = []

[ui]
icon = "package-check"
order = 74

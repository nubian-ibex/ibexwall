id = "apps.flatpak-perms"
version = "0.1.0"
api = 1
category = "apps"
kinds = ["check"]
origin = "official"
license = "GPL-3.0-or-later"
binary = "ibexwall-plugin-flatpak-perms"
default_enabled = true
distros = ["fedora", "ubuntu", "debian", "arch"]

[name]
en = "Flatpak permissions"
pt-BR = "Permissões dos Flatpak"

[description]
en = "Lists Flatpak apps that can reach your files, devices or the sandbox's own controls."
pt-BR = "Lista os apps Flatpak que alcançam seus arquivos, dispositivos ou os controles do próprio sandbox."

[privileges]
# Read-only check: the core executes nothing on its behalf.

[sandbox]
user = "dynamic"
capabilities = ["CAP_DAC_READ_SEARCH"]
read_paths = ["/var/lib/flatpak", "/home"]
network = false

[risk]
affects = []
reversible = "immediate"
confirm_timeout = false
may_affect = []

[ui]
icon = "package-check"
order = 74

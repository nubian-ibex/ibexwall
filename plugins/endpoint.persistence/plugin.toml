id = "endpoint.persistence"
version = "0.1.0"
api = 1
category = "endpoint"
kinds = ["check", "control"]
origin = "official"
license = "GPL-3.0-or-later"
binary = "ibexwall-plugin-persistence"
default_enabled = false
distros = ["fedora", "ubuntu", "debian", "arch"]

[name]
en = "Persistence"
pt-BR = "Persistência"

[description]
en = "Watches the places a program can use to stay on this computer (units, cron, autostart, shell start-up, LD_PRELOAD) and reports what changed."
pt-BR = "Vigia os lugares que um programa pode usar para ficar neste computador (units, cron, autostart, inicialização do shell, LD_PRELOAD) e relata o que mudou."

[privileges]
write_paths = ["/var/lib/ibexwall/persistence"]

[sandbox]
user = "dynamic"
capabilities = []
read_paths = ["/etc/systemd/system", "/usr/lib/systemd/system", "/etc/cron.d", "/etc/cron.daily", "/etc/cron.hourly", "/etc/cron.weekly", "/etc/cron.monthly", "/etc/crontab", "/var/spool/cron", "/etc/xdg/autostart", "/home", "/root", "/etc/ld.so.preload", "/etc/profile", "/etc/profile.d", "/etc/bash.bashrc", "/etc/bashrc", "/var/lib/ibexwall/persistence"]
network = false

[risk]
affects = []
reversible = "immediate"
confirm_timeout = false

[ui]
icon = "clock"
order = 92

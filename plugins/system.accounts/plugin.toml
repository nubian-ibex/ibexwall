id = "system.accounts"
version = "0.1.0"
api = 1
category = "system"
kinds = ["check"]
origin = "official"
license = "GPL-3.0-or-later"
binary = "ibexwall-plugin-accounts"
default_enabled = true
distros = ["fedora", "ubuntu", "debian", "arch"]

[name]
en = "Accounts"
pt-BR = "Contas"
es = "Cuentas"
fr = "Comptes"
de = "Konten"

[description]
en = "Checks for accounts without a password, extra administrator accounts and sign-in lockout."
pt-BR = "Procura contas sem senha, contas de administrador extras e bloqueio após tentativas de login."
es = "Comprueba si hay cuentas sin contraseña, cuentas de administrador adicionales y el bloqueo por intentos de inicio de sesión."
fr = "Vérifie les comptes sans mot de passe, les comptes administrateur supplémentaires et le verrouillage après des échecs de connexion."
de = "Prüft auf Konten ohne Passwort, zusätzliche Administratorkonten und die Sperre bei fehlgeschlagenen Anmeldungen."

[privileges]
# Read-only check: the core executes nothing on its behalf.

[sandbox]
user = "dynamic"
# /etc/shadow is root-only; without this the check says "not assessed".
capabilities = ["CAP_DAC_READ_SEARCH"]
read_paths = ["/etc/passwd", "/etc/shadow", "/etc/security", "/etc/pam.d"]
network = false

[risk]
affects = []
reversible = "immediate"
confirm_timeout = false
may_affect = []

[ui]
icon = "users"
order = 66

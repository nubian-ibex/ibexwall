id = "system.audit"
version = "0.1.0"
api = 1
category = "system"
kinds = ["check"]
origin = "official"
license = "GPL-3.0-or-later"
binary = "ibexwall-plugin-audit"
default_enabled = false
distros = ["fedora", "ubuntu", "debian", "arch"]

[name]
en = "Security audit"
pt-BR = "Auditoria de segurança"

[description]
en = "Shows the warnings and suggestions of Lynis when it is installed. IbexWall does not bundle or run it."
pt-BR = "Mostra os avisos e sugestões do Lynis quando ele está instalado. O IbexWall não o inclui nem o executa."

[privileges]
# Read-only check: the core executes nothing on its behalf.

[sandbox]
user = "dynamic"
capabilities = ["CAP_DAC_READ_SEARCH"]
read_paths = ["/var/log/lynis-report.dat", "/usr/bin/lynis", "/usr/sbin/lynis", "/usr/share/lynis"]
network = false

[risk]
affects = []
reversible = "immediate"
confirm_timeout = false
may_affect = []

[ui]
icon = "clipboard-check"
order = 70

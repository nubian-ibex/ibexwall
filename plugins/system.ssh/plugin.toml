id = "system.ssh"
version = "0.1.0"
api = 1
category = "system"
kinds = ["check", "control"]
origin = "official"
license = "GPL-3.0-or-later"
binary = "ibexwall-plugin-ssh"
default_enabled = true
distros = ["fedora", "ubuntu", "debian", "arch"]

[name]
en = "SSH server"
pt-BR = "Servidor SSH"
es = "Servidor SSH"
fr = "Serveur SSH"
de = "SSH-Server"

[description]
en = "Checks the SSH server's settings (root login, empty passwords, forwarding) and tightens them with a drop-in."
pt-BR = "Verifica as configurações do servidor SSH (login de root, senhas vazias, encaminhamento) e as reforça com um drop-in."
es = "Comprueba los ajustes del servidor SSH (inicio de sesión de root, contraseñas vacías, reenvío) y los refuerza con un archivo drop-in."
fr = "Vérifie les réglages du serveur SSH (connexion root, mots de passe vides, redirections) et les renforce avec un fichier drop-in."
de = "Prüft die Einstellungen des SSH-Servers (root-Anmeldung, leere Passwörter, Weiterleitung) und verschärft sie mit einer Drop-in-Datei."

[privileges]
write_paths = ["/etc/ssh/sshd_config.d"]
units = ["sshd.service", "ssh.service"]
unit_actions = ["restart"]
exec = [{ path = "/usr/sbin/sshd", args = ["-t"] }]

[sandbox]
user = "dynamic"
capabilities = ["CAP_DAC_READ_SEARCH"]
read_paths = ["/etc/ssh", "/usr/sbin/sshd", "/usr/lib/systemd/system", "/run"]
network = false

[risk]
affects = ["remote-access"]
reversible = "immediate"
confirm_timeout = true
may_affect = ["ssh-may-affect-root", "ssh-may-affect-password"]

[ui]
icon = "terminal"
order = 64

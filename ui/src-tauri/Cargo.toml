[package]
name = "ibexwall-desktop"
description = "IbexWall desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "ibexwall_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serve the built frontend (ui/dist) from the binary instead of the Vite dev
# server; `tauri build` turns this on, and so does scripts/dev-sandbox.sh.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ibexwall-proto.workspace = true
ibexwall-token.workspace = true
ibexwall-varlink.workspace = true
serde_json.workspace = true
serde.workspace = true
base64.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
